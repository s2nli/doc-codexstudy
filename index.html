<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2428a8">
<title>HRRY DISHA</title>
<style>html,body{margin:0;background:#0b0e24;color:#fff;font:15px system-ui,sans-serif}p{padding:24px}a{color:#9aa8ff}</style>
</head>
<body>
<p id="m">Loading…</p>
<script>
/* "/" opens HRRY directly (live proxy at /api/site/). The old doc page lives at /doc. */
fetch("/api/site/", { cache: "no-store" })
  .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
  .then(function (h) { document.open(); document.write(h); document.close(); })
  .catch(function (e) {
    document.getElementById("m").innerHTML = "HRRY load nahi hua (" + e.message + "). <a href=\"/api/site/\">Direct kholo</a> · <a href=\"/doc\">Doc page</a>";
  });
</script>
</body>
</html>
